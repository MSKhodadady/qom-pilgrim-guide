info:
  name: reset pass
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "username": "",
        "password": "",
        "password_confirmation": "",
        "secret_key": "{{auth_secret_key}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
