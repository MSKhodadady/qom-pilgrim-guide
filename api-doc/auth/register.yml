info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "",
        "password": "",
        "password_confirmation": "",
        "secret_key": "{{auth_secret_key}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
